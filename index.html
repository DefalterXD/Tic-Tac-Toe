<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="counter__container">
        <h2 class="playerOne"></h2>
        <h2 class="playerTwo"></h2>
    </div>
    <form action="#" id="playerForm">
        <h1 class="title">Tic-Tac-Toe</h1>
        <div class="playerField">
            <label for="playerOne">Player One Name:</label>
            <input type="text" id="playerOne" autocomplete="off" placeholder="Player One" autofocus>
        </div>
        <div class="playerField">
            <label for="playerTwo">Player Two Name:</label>
            <input type="text" id="playerTwo" autocomplete="off" placeholder="Player Two" autofocus>
        </div>
        <button type="button" class="playerSubmit">Play</button>
    </form>
    <div class="game__container">
        <h1 class="playerTurn"></h1>
        <div class="board"></div>

        <button class="again hidden">Play Again</button>
    </div>
    <script src="./script.js"></script>
</body>

</html>
